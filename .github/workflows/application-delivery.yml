name: Application delivery (manufactured)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate project Python and record actual runner capacity
        run: python scripts/ci_project_environment.py --output "${{ runner.temp }}/project-python" --observations "${{ runner.temp }}/resource-observations.json"
      - run: python scripts/install_successor.py --profile ordinary --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/ordinary-successor-source"
      - run: python scripts/install_successor.py --profile application --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/application-successor-source"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest tests/test_inspection_contract.py tests/test_inspection_registry.py tests/test_inspection_service.py tests/test_inspection_lifecycle.py tests/test_heldout_cleanup.py tests/test_cleanup_successor.py tests/test_accounting_successor.py
      - name: Provision test browser (no model/data)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Provision Linux test browser dependencies (ephemeral runner)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Browser to API acceptance (manufactured only)
        env:
          VISIONGUARD_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_inspection_browser.py
      - run: python scripts/successor_build.py --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/distribution-source" --dist "${{ env.VISIONGUARD_PROJECT_TEMP }}/application-dist"
      - name: Clean wheel and sdist acceptance outside source
        env:
          VG_DIST: ${{ env.VISIONGUARD_PROJECT_TEMP }}/application-dist
          VG_ENVS: ${{ env.VISIONGUARD_PROJECT_TEMP }}/application-install
        run: python scripts/inspection_package_acceptance.py
      - name: Verify current CI/runtime successor and historical source anchors
        run: python scripts/ci_runtime_freeze.py
      - name: Retain actual capacity observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-${{ github.job }}-${{ runner.os }}-${{ matrix.python }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/resource-observations.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/resource-before-tests.jsonl
          if-no-files-found: warn

name: Authorization amendment (synthetic security only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate project Python and record actual runner capacity
        run: python scripts/ci_project_environment.py --output "${{ runner.temp }}/project-python" --observations "${{ runner.temp }}/resource-observations.json"
      - run: python scripts/install_successor.py --profile ordinary --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/ordinary-successor-source"
      - run: python scripts/security_amendment_freeze.py
      - run: python -m pytest tests/test_windows_trust_acl.py tests/test_authorization_amendment.py tests/test_heldout_authorization.py
      - run: python scripts/heldout_activation_acceptance.py --output /tmp/amended-artificial-acceptance
      - name: Verify current CI/runtime successor and historical source anchors
        run: python scripts/ci_runtime_freeze.py
      - name: Retain actual capacity observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-${{ github.job }}-${{ runner.os }}-${{ matrix.python }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/resource-observations.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/resource-before-tests.jsonl
          if-no-files-found: warn

name: B2 readiness (synthetic only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[analysis,dev]'
      - run: python scripts/phase4d_b1_freeze.py
      - run: python scripts/phase4d_b2_freeze.py
      - run: python -m visionguard.visa_b2_runner --plan
      - run: python -m visionguard.visa_b2_runner --synthetic --output /tmp/b2-synthetic > /tmp/b2-report.json
      - run: python -m pytest tests/test_visa_b2_readiness.py

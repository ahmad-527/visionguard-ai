name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os == 'ubuntu-latest' && format('Python {0}', matrix.python-version) || format('Windows / Python {0}', matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[analysis,dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify closed B1 evaluator freeze and synthetic-only interfaces
        run: |
          python scripts/phase4d_b1_freeze.py
          python -c "import os, subprocess, sys; from pathlib import Path; out = Path(os.environ['RUNNER_TEMP']) / 'b1-synthetic.json'; result = subprocess.run([sys.executable, '-m', 'visionguard.visa_evaluator_synthetic', '--repository', '.'], check=True, stdout=subprocess.PIPE); out.write_bytes(result.stdout)"
          python -m visionguard.visa_evaluator_artifacts --help

      - name: Verify VisA freeze and lightweight command interfaces
        run: |
          visionguard-visa-protocol
          visionguard-visa-audit --help
          visionguard-visa-plan --help
          visionguard-visa-smoke --help
          visionguard-visa-develop --help
          visionguard-visa-develop --model patchcore --output outputs/ci-plan --plan
          visionguard-visa-develop --model efficientad --output outputs/ci-plan --plan

name: Controlled activation (artificial only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  activation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[analysis,dev]'
      - run: python scripts/phase4d_b1_freeze.py
      - run: python scripts/phase4d_b2_freeze.py
      - run: python scripts/heldout_activation_freeze.py
      - run: python -m pytest tests/test_heldout_metrics.py tests/test_heldout_admission.py tests/test_heldout_authorization.py tests/test_heldout_execution.py
      - run: python -m visionguard.heldout_runner --artificial /tmp/heldout-artificial > /tmp/heldout-artificial-report.json

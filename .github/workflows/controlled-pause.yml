name: Controlled pause v3 (synthetic only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pause:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[analysis,dev]'
      - run: python scripts/operational_successor_freeze.py
      - run: mkdir -p outputs/engineering && test ! -e outputs/engineering/pause-ci-${{ matrix.python-version }}
      - run: python -m pytest tests/test_heldout_pause.py tests/test_operational_successor.py --basetemp=outputs/engineering/pause-ci-${{ matrix.python-version }}
      - run: python -m pip check

name: ML CPU successor (manufactured native)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      VISIONGUARD_CPU_SUCCESSOR_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate project Python and record actual runner capacity
        run: python scripts/ci_project_environment.py --output "${{ runner.temp }}/project-python" --observations "${{ runner.temp }}/resource-observations.json"
      - run: python -m pip install pip==26.2.1 setuptools==84.2.1
      - name: CPU wheels from sole official CPU index (no mixed-index fallback)
        run: python -m pip --isolated install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu torchvision==0.28.0+cpu --report "${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-wheels.json"
      - name: Separately pinned application runtime, never historical ML extra
        run: python scripts/install_successor.py --profile native --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/native-successor-source"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Actual native random/generated states plus application and freeze-chain regression
        run: python -m pytest tests/test_inspection_cpu_successor.py tests/test_inspection_runtime.py tests/test_inspection_native.py tests/test_inspection_registry.py tests/test_inspection_contract.py tests/test_inspection_service.py tests/test_inspection_lifecycle.py tests/test_heldout_cleanup.py tests/test_heldout_execution.py tests/test_heldout_pause.py tests/test_cleanup_successor.py tests/test_accounting_successor.py tests/test_operational_successor.py tests/test_heldout_accounting.py --basetemp="${{ env.VISIONGUARD_PROJECT_TEMP }}/generated-native-tests" --junitxml="${{ env.VISIONGUARD_PROJECT_TEMP }}/native-test-results.xml"
      - run: python scripts/cleanup_successor_freeze.py
      - run: python scripts/ml_cpu_inventory.py --output "${{ env.VISIONGUARD_PROJECT_TEMP }}/dependency-inventory.json" --pip-report "${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-wheels.json" --pip-report "${{ env.VISIONGUARD_PROJECT_TEMP }}/project-dependencies-native.json"
      - name: Fresh unfiltered dependency scans (not PT2 security clearance)
        run: python scripts/ml_cpu_audit.py --output "${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-audit"
      - name: Build application wheels and sdists
        run: |
          python scripts/successor_build.py --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/distribution-source" --dist "${{ env.VISIONGUARD_PROJECT_TEMP }}/application-dist"
      - name: Installed CLI/API and packaged browser resources outside checkout
        env:
          VG_DIST: ${{ env.VISIONGUARD_PROJECT_TEMP }}/application-dist
          VG_ENVS: ${{ env.VISIONGUARD_PROJECT_TEMP }}/application-install
        run: python scripts/inspection_package_acceptance.py
      - name: Retain public dependency and test evidence (no tensor/permission fixtures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ml-cpu-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-wheels.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/project-dependencies-native.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/dependency-inventory.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/native-test-results.xml
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-audit/audit-*.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/cpu-audit/audit-*.log
          if-no-files-found: warn
      - name: Verify current CI/runtime successor and historical source anchors
        run: python scripts/ci_runtime_freeze.py
      - name: Retain actual capacity observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-${{ github.job }}-${{ runner.os }}-${{ matrix.python }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/resource-observations.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/resource-before-tests.jsonl
          if-no-files-found: warn

name: Output accounting safeguards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accounting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate project Python and record actual runner capacity
        run: python scripts/ci_project_environment.py --output "${{ runner.temp }}/project-python" --observations "${{ runner.temp }}/resource-observations.json"
      - run: python scripts/install_successor.py --profile ordinary --source "${{ env.VISIONGUARD_PROJECT_TEMP }}/ordinary-successor-source"
      - name: Verify immutable predecessors and diagnostics successor
        run: |
          python scripts/operational_successor_freeze.py
          python scripts/output_accounting_freeze.py
          python scripts/cleanup_successor_freeze.py
      - name: Synthetic accounting, freeze-chain and shutdown acceptance
        run: >-
          python -m pytest tests/test_heldout_accounting.py
          tests/test_accounting_successor.py tests/test_operational_successor.py
          tests/test_cleanup_successor.py tests/test_heldout_execution.py
          tests/test_heldout_pause.py tests/test_heldout_cleanup.py
      - run: python -m pip check
      - name: Verify current CI/runtime successor and historical source anchors
        run: python scripts/ci_runtime_freeze.py
      - name: Retain actual capacity observations only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-${{ github.job }}-${{ runner.os }}-${{ matrix.python }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/resource-observations.json
            ${{ env.VISIONGUARD_PROJECT_TEMP }}/resource-before-tests.jsonl
          if-no-files-found: warn

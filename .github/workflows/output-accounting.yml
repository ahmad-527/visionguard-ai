name: Output accounting safeguards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accounting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[analysis,dev]"
      - name: Verify immutable predecessors and diagnostics successor
        run: |
          python scripts/operational_successor_freeze.py
          python scripts/output_accounting_freeze.py
          python scripts/cleanup_successor_freeze.py
      - name: Synthetic accounting, freeze-chain and shutdown acceptance
        run: >-
          python -m pytest tests/test_heldout_accounting.py
          tests/test_accounting_successor.py tests/test_operational_successor.py
          tests/test_cleanup_successor.py tests/test_heldout_execution.py
          tests/test_heldout_pause.py tests/test_heldout_cleanup.py
      - run: python -m pip check

dataset:
  name: mvtec_ad_2
  version: official_release
  categories:
    - can
    - fabric
    - fruit_jelly
    - rice
    - sheet_metal
    - vial
    - wallplugs
    - walnuts
  image_extensions:
    - .png
  splits:
    train:
      layout: classified
      conditions: [good]
    validation:
      layout: classified
      conditions: [good]
    test_public:
      layout: classified
      conditions: [good, bad]
      mask:
        image_condition: bad
        directory: ground_truth
        suffix: _mask
    test_private:
      layout: flat
      conditions: []
    test_private_mixed:
      layout: flat
      conditions: []

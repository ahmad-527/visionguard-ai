      source_split: fit
      normal_only: true
      student_teacher_lower_quantile: 0.9
      student_teacher_upper_quantile: 0.995
      student_autoencoder_lower_quantile: 0.9
      student_autoencoder_upper_quantile: 0.995
      scale: 0.1
    calibration:
      normal_only: true
      split: calibration
      comparison: score_strictly_greater_than_threshold
      image:
        method: highest_order_statistic
        calibration_unit: normalized_image_anomaly_score
        minimum_samples: 19
      pixel:
        method: highest_order_statistic
        calibration_unit: per_image_maximum_normalized_restored_map_score
        minimum_samples: 19
    metrics:

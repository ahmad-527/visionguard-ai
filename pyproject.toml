[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visionguard-ai"
version = "0.1.0"
description = "Integrity-first tooling for industrial visual anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]
ml = [
  "anomalib==2.6.0",
  "timm==1.0.28",
  "torch==2.9.1",
  "torchvision==0.24.1",
]

[project.scripts]
visionguard-audit = "visionguard.cli:main"
visionguard-patchcore-smoke = "visionguard.runner:main"
visionguard-patchcore-benchmark = "visionguard.benchmark:main"
visionguard-repeatability-compare = "visionguard.repeatability:main"
visionguard-efficientad-smoke = "visionguard.efficientad_smoke:main"
visionguard-efficientad-benchmark = "visionguard.efficientad_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visionguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
